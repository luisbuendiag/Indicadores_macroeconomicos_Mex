name: Pruebas

on:
  push:
    branches: ["**"]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Calendario y notas Word locales
        run: node --test tests/calendar_ui.test.mjs tests/bulletin_upload.test.mjs tests/bulletin_products.test.mjs tests/update_health.test.mjs tests/bulletin_cycles.test.mjs tests/bulletin_final.test.mjs
      - name: Validación de datos
        run: python scripts/validate.py
      - name: Pruebas unitarias
        run: python -m pytest -q
