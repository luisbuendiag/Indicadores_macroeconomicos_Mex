name: Vigilar actualizaciones
on:
  workflow_dispatch: {}
  schedule:
    - cron: '47 8,14,16,20 * * 1-5'
  workflow_run:
    workflows: ['Actualizar datos (pipeline)', 'Desplegar a GitHub Pages']
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: update-watchdog
  cancel-in-progress: false
jobs:
  check:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/update_watchdog.cjs').watchdog({github, context, core});
