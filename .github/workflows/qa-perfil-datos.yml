name: QA optimización y perfil de datos
on:
  push:
    branches: [codex/optimizar-consultas-bie]
    paths:
      - '.github/workflows/qa-perfil-datos.yml'
      - 'scripts/qa_profile_data.py'
      - 'scripts/sources/inegi.py'

permissions:
  contents: read

jobs:
  medir:
    strategy:
      fail-fast: false
      matrix:
        modo: [bie, pipeline]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Ejecutar la medición aislada
        env:
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          MODO: ${{ matrix.modo }}
        run: |
          set -o pipefail
          python scripts/qa_profile_data.py "$MODO" | tee -a "$GITHUB_STEP_SUMMARY"
