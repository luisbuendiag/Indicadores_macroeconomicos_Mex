name: Actualizar datos (pipeline)
run-name: ${{ inputs.recovery_slot && format('Recuperación {0}', inputs.recovery_slot) || 'Actualización de datos' }}

# Actualiza la capa de datos y regenera productos. Si la validación crítica
# falla, el workflow se detiene y no se despliega.
#
# Horarios (UTC -> America/Mexico_City, UTC-6):
#   07:17 UTC  = 01:17 hora Ciudad de México (madrugada, boletines medianoche)
#   13:17 UTC  = 07:17 hora Ciudad de México (matutino, inicio de jornada)
#   19:17 UTC  = 13:17 hora Ciudad de México (mediodía, publicaciones de la mañana)
#   15:17 UTC  = 09:17 hora Ciudad de México (después de publicaciones matutinas)
# Minuto 17 reduce la exposición a la congestión de inicio de hora de GitHub.
# INEGI publica normalmente antes de las 08:00-09:00 CT; Banxico lo hace en
# días hábiles por la mañana. Las corridas adicionales capturan retrasos ocasionales.
#
# Si una fuente no ha publicado aún, build_data.py usa el dato ya cargado y
# marca el estado correspondiente (PUBLICACIÓN PENDIENTE / REZAGADO). Si el
# dato aparece más tarde ese mismo día, la siguiente ejecución programada lo
# captura; no se hace polling continuo.
on:
  workflow_dispatch:
    inputs:
      recovery_slot:
        description: Corte recuperado por la vigilancia automática
        type: string
        default: ''
  schedule:
    - cron: "17 7,13,15,19 * * 1-5"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

# Las corridas se serializan; un push no cancela la actualización en curso. [notes-only] usa la ficha vigente y omite solo las tareas de datos.
concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pipeline de datos
        if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[notes-only]') }}
        env:
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: python scripts/build_data.py

      - name: Regenerar calendario de publicaciones
        if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[notes-only]') }}
        run: python scripts/build_calendar.py
        continue-on-error: true
        timeout-minutes: 30

      - name: Recopilar noticias oficiales (a prueba de fallos)
        if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[notes-only]') }}
        run: python scripts/fetch_news.py || true

      - name: Regenerar Excel
        if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[notes-only]') }}
        run: python scripts/build_excel.py

      - name: Validar Excel históricos y extensión de series
        if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[notes-only]') }}
        run: python -m pytest -q tests/test_excel_historico.py

      - name: Aprovisionar notas institucionales (.docx)
        run: python scripts/build_notes.py

      - name: Instalar renderer y fuentes del piloto de notas
        if: ${{ vars.NOTES_PILOT_ENABLED != 'false' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-noto-core

      - name: Generar y validar nota IMOAM con Python
        if: ${{ vars.NOTES_PILOT_ENABLED != 'false' }}
        timeout-minutes: 12
        env:
          NOTES_AUTO_PUBLISH: ${{ vars.NOTES_AUTO_PUBLISH || 'true' }}
          NOTES_WORK_DIR: ${{ runner.temp }}/notas-imoam
        run: python scripts/build_auto_notes.py --publish --record-status

      - name: Generar y validar notas IMAI e IGAE con Python
        if: ${{ vars.NOTES_PILOT_ENABLED != 'false' }}
        timeout-minutes: 12
        env:
          NOTES_AUTO_PUBLISH: ${{ vars.NOTES_AUTO_PUBLISH || 'true' }}
          NOTES_WORK_DIR: ${{ runner.temp }}/notas-imoam
        run: python scripts/build_activity_notes.py --publish

      - name: Generar y validar notas EMIM y EMOE con Python
        if: ${{ vars.NOTES_PILOT_ENABLED != 'false' }}
        timeout-minutes: 12
        env:
          NOTES_AUTO_PUBLISH: ${{ vars.NOTES_AUTO_PUBLISH || 'true' }}
          NOTES_WORK_DIR: ${{ runner.temp }}/notas-imoam
        run: python scripts/build_survey_notes.py --publish

      - name: Generar y validar notas IMCP e IMFBCF con Python
        if: ${{ vars.NOTES_PILOT_ENABLED != 'false' }}
        timeout-minutes: 12
        env:
          NOTES_AUTO_PUBLISH: ${{ vars.NOTES_AUTO_PUBLISH || 'true' }}
          NOTES_WORK_DIR: ${{ runner.temp }}/notas-imoam
        run: python scripts/build_demand_notes.py --publish

      - name: Generar y validar notas INPC e INPP con Python
        if: ${{ vars.NOTES_PILOT_ENABLED != 'false' }}
        timeout-minutes: 12
        env:
          NOTES_AUTO_PUBLISH: ${{ vars.NOTES_AUTO_PUBLISH || 'true' }}
          NOTES_WORK_DIR: ${{ runner.temp }}/notas-imoam
        run: python scripts/build_price_notes.py --publish

      - name: Generar y validar notas PIB oportuno y trimestral con Python
        if: ${{ vars.NOTES_PILOT_ENABLED != 'false' }}
        timeout-minutes: 12
        env:
          NOTES_AUTO_PUBLISH: ${{ vars.NOTES_AUTO_PUBLISH || 'true' }}
          NOTES_WORK_DIR: ${{ runner.temp }}/notas-imoam
        run: python scripts/build_gdp_notes.py --publish

      - name: Generar y validar nota SIC con Python
        if: ${{ vars.NOTES_PILOT_ENABLED != 'false' }}
        timeout-minutes: 12
        env:
          NOTES_AUTO_PUBLISH: ${{ vars.NOTES_AUTO_PUBLISH || 'true' }}
          NOTES_WORK_DIR: ${{ runner.temp }}/notas-imoam
        run: python scripts/build_cycle_notes.py --publish

      - name: Generar y validar nota IOAE con Python
        if: ${{ vars.NOTES_PILOT_ENABLED != 'false' }}
        timeout-minutes: 12
        env:
          NOTES_AUTO_PUBLISH: ${{ vars.NOTES_AUTO_PUBLISH || 'true' }}
          NOTES_WORK_DIR: ${{ runner.temp }}/notas-imoam
        run: python scripts/build_nowcast_notes.py --publish

      - name: Generar y validar nota ENOE con Python
        if: ${{ vars.NOTES_PILOT_ENABLED != 'false' }}
        timeout-minutes: 12
        env:
          NOTES_AUTO_PUBLISH: ${{ vars.NOTES_AUTO_PUBLISH || 'true' }}
          NOTES_WORK_DIR: ${{ runner.temp }}/notas-imoam
        run: python scripts/build_labor_notes.py --publish

      - name: Generar y validar nota BCMM con Python
        if: ${{ vars.NOTES_PILOT_ENABLED != 'false' }}
        timeout-minutes: 12
        env:
          NOTES_AUTO_PUBLISH: ${{ vars.NOTES_AUTO_PUBLISH || 'true' }}
          NOTES_WORK_DIR: ${{ runner.temp }}/notas-imoam
        run: python scripts/build_trade_notes.py --publish

      - name: Generar notas individuales de Banxico e IED
        run: python scripts/build_financial_notes.py

      - name: Conservar revisión del piloto de notas
        if: ${{ always() && vars.NOTES_PILOT_ENABLED != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: notas-qa-${{ github.run_attempt }}
          path: ${{ runner.temp }}/notas-imoam
          if-no-files-found: ignore
          retention-days: 7

      - name: Validar (estricto para el reporte de CI)
        run: python scripts/validate.py

      - name: Registrar estado de consulta y productos
        run: python scripts/build_update_health.py

      - name: Commit de artefactos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main avanzó durante la generación. Se conserva la publicación anterior; la siguiente corrida regenerará desde main actualizado."
            exit 1
          fi
          git add data/ downloads/
          if git diff --cached --quiet; then
            echo "Sin cambios en datos."
          else
            git commit -m "chore(data): actualización automática del pipeline [skip ci]"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar sitio para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
          name: github-pages-${{ github.run_attempt }}

  deploy:
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: update
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
